apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: spaceops
    user: postgres
    secureJsonData:
      password: postgrespassword
    jsonData:
      sslmode: disable
      postgresVersion: 15
      timescaledb: true
    editable: true
