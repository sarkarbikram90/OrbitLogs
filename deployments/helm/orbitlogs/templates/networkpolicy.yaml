{{- if .Values.networkPolicy.enabled }}
{{- range $name, $service := .Values.services }}
{{- if and $service.enabled $service.port }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orbitlogs-{{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: orbitlogs-{{ $name }}
spec:
  podSelector:
    matchLabels:
      app: orbitlogs-{{ $name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $.Values.global.namespace }}
    ports:
    - protocol: TCP
      port: {{ $service.port }}
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: {{ $service.port }}
  egress:
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow traffic to same namespace
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $.Values.global.namespace }}
---
{{- end }}
{{- end }}
{{- end }}
