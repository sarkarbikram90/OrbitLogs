{{- range $name, $service := .Values.services }}
{{- if and $service.enabled (gt (int ($service.replicas | default 1)) 1) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbitlogs-{{ $name }}
  namespace: {{ $.Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbitlogs-{{ $name }}
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
---
{{- end }}
{{- end }}
