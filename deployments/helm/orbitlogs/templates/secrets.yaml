apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.databaseSecretName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "orbitlogs.labels" . | nindent 4 }}
type: Opaque
stringData:
  database_url: {{ .Values.secrets.databaseUrl | quote }}
  postgres_password: {{ .Values.secrets.postgresPassword | quote }}
  kafka_sasl_password: {{ .Values.secrets.kafkaSaslPassword | quote }}
  api_key: {{ .Values.secrets.apiKey | quote }}
  jwt_secret: {{ .Values.secrets.jwtSecret | quote }}
  gemini_api_key: {{ .Values.secrets.geminiApiKey | quote }}
