apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.databaseSecretName }}
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  database_url: {{ .Values.secrets.databaseUrl | quote }}
  api_key: {{ .Values.secrets.apiKey | quote }}
  jwt_secret: {{ .Values.secrets.jwtSecret | quote }}
  gemini_api_key: {{ .Values.secrets.geminiApiKey | quote }}
