{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitlogs-{{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: orbitlogs-{{ $name }}
    app.kubernetes.io/component: {{ $name }}
    {{- include "orbitlogs.labels" $ | nindent 4 }}
spec:
  {{- if not (and $service.autoscaling $service.autoscaling.enabled) }}
  replicas: {{ $service.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: orbitlogs-{{ $name }}
  template:
    metadata:
      labels:
        app: orbitlogs-{{ $name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- if $.Values.serviceAccount.create }}
      serviceAccountName: {{ $.Values.serviceAccount.name | default "orbitlogs" }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: orbitlogs-{{ $name }}
      containers:
      - name: orbitlogs-{{ $name }}
        {{- if $.Values.global.imageRegistry }}
        image: {{ $.Values.global.imageRegistry }}/{{ $service.image }}:{{ $.Values.global.imageTag | default "latest" }}
        {{- else }}
        image: {{ $service.image }}:{{ $.Values.global.imageTag | default "latest" }}
        {{- end }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        {{- if $service.port }}
        ports:
        - containerPort: {{ $service.port }}
        {{- end }}
        {{- if and $service.port $service.livenessPath }}
        livenessProbe:
          httpGet:
            path: {{ $service.livenessPath }}
            port: {{ $service.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        {{- end }}
        {{- if and $service.port $service.readinessPath }}
        readinessProbe:
          httpGet:
            path: {{ $service.readinessPath }}
            port: {{ $service.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        {{- end }}
        env:
        - name: RUST_LOG
          value: {{ $.Values.global.rustLog | default "info" | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.global.databaseSecretName }}
              key: database_url
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.global.apiKeySecretName }}
              key: api_key
        - name: KAFKA_BROKERS
          value: {{ $.Values.global.kafkaBrokers | quote }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ $.Values.global.otelEndpoint | quote }}
        {{- if $service.port }}
        - name: PORT
          value: {{ $service.port | quote }}
        - name: HTTP_PORT
          value: {{ $service.port | quote }}
        {{- end }}
        {{- range $envVar := $service.env }}
        - name: {{ $envVar.name }}
          value: {{ $envVar.value | quote }}
        {{- end }}
        resources:
          {{- toYaml $service.resources | nindent 10 }}
---
{{- if $service.port }}
apiVersion: v1
kind: Service
metadata:
  name: orbitlogs-{{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: orbitlogs-{{ $name }}
    {{- include "orbitlogs.labels" $ | nindent 4 }}
spec:
  ports:
  - port: {{ $service.port }}
    targetPort: {{ $service.port }}
    protocol: TCP
  selector:
    app: orbitlogs-{{ $name }}
---
{{- end }}
{{- end }}
{{- end }}
