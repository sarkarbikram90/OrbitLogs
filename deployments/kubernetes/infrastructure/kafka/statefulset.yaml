apiVersion: v1
kind: Service
metadata:
  name: orbitlogs-kafka-headless
  namespace: orbitlogs
spec:
  clusterIP: None
  ports:
  - port: 9092
    name: broker
  - port: 9093
    name: controller
  selector:
    app: orbitlogs-kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orbitlogs-kafka
  namespace: orbitlogs
spec:
  serviceName: orbitlogs-kafka-headless
  replicas: 3
  selector:
    matchLabels:
      app: orbitlogs-kafka
  template:
    metadata:
      labels:
        app: orbitlogs-kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        ports:
        - containerPort: 9092
          name: broker
        - containerPort: 9093
          name: controller
        env:
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "0@orbitlogs-kafka-0.orbitlogs-kafka-headless.orbitlogs.svc.cluster.local:9093,1@orbitlogs-kafka-1.orbitlogs-kafka-headless.orbitlogs.svc.cluster.local:9093,2@orbitlogs-kafka-2.orbitlogs-kafka-headless.orbitlogs.svc.cluster.local:9093"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://$(POD_NAME).orbitlogs-kafka-headless.orbitlogs.svc.cluster.local:9092"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_KRAFT_CLUSTER_ID
          value: "4L62C12345678901234567"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
          - bash
          - -c
          - |
            export KAFKA_NODE_ID=${HOSTNAME##*-}
            /etc/confluent/docker/run
