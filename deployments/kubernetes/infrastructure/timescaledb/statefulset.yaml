apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orbitlogs-timescaledb
  namespace: orbitlogs
spec:
  serviceName: orbitlogs-timescaledb
  replicas: 1
  selector:
    matchLabels:
      app: orbitlogs-timescaledb
  template:
    metadata:
      labels:
        app: orbitlogs-timescaledb
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:latest-pg15
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "orbitlogs"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: postgres_password
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: orbitlogs-timescaledb
  namespace: orbitlogs
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: orbitlogs-timescaledb
