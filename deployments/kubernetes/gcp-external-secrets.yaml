# =============================================================================
# OrbitLogs Enterprise Production Secrets Management
# Target Cloud / Region: GCP asia-south1 (Mumbai)
# Secrets Engine: External Secrets Operator (ESO) + Google Secret Manager (GSM)
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  namespace: orbitlogs
spec:
  provider:
    gcpsm:
      projectID: orbitlogs-prod-asia-south1
      auth:
        workloadIdentity:
          clusterLocation: asia-south1
          clusterName: orbitlogs-gke-cluster
          serviceAccountRef:
            name: orbitlogs-eso-sa
            namespace: orbitlogs
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: orbitlogs-secrets
  namespace: orbitlogs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: orbitlogs-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres_password
      remoteRef:
        key: orbitlogs-postgres-password
    - secretKey: kafka_sasl_password
      remoteRef:
        key: orbitlogs-kafka-password
    - secretKey: api_key
      remoteRef:
        key: orbitlogs-api-key
    - secretKey: jwt_secret
      remoteRef:
        key: orbitlogs-jwt-secret
    - secretKey: database_url
      remoteRef:
        key: orbitlogs-database-url
    - secretKey: gemini_api_key
      remoteRef:
        key: orbitlogs-gemini-api-key
