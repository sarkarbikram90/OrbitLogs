apiVersion: apps/v1
kind: Deployment
metadata:
  name: spaceops-orbit-ops
  namespace: spaceops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spaceops-orbit-ops
  template:
    metadata:
      labels:
        app: spaceops-orbit-ops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: spaceops-orbit-ops
        image: spaceops/spaceops-orbit-ops:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8095
        livenessProbe:
          httpGet:
            path: /liveness
            port: 8095
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8095
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: RUST_LOG
          value: "info,orbit_ops_service=debug"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: spaceops-secrets
              key: database_url
        - name: RUN_MIGRATIONS
          value: "false"
        - name: KAFKA_BROKERS
          value: "spaceops-kafka-headless:9092"
        - name: PORT
          value: "8095"
        - name: PROCESSED_TOPIC
          value: "telemetry.processed"
        - name: TIMELINE_EVENTS_TOPIC
          value: "timeline.events"
        - name: COMMAND_EVENTS_TOPIC
          value: "command.events"
        - name: CONTACT_EVENTS_TOPIC
          value: "contact.events"
        - name: GROUP_ID
          value: "orbit-ops-group"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spaceops-orbit-ops
  namespace: spaceops
spec:
  ports:
  - port: 8095
    targetPort: 8095
  selector:
    app: spaceops-orbit-ops
