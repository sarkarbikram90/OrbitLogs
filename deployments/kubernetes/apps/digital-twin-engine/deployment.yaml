apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitlogs-digital-twin
  namespace: orbitlogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbitlogs-digital-twin
  template:
    metadata:
      labels:
        app: orbitlogs-digital-twin
    spec:
      containers:
      - name: orbitlogs-digital-twin
        image: orbitlogs/orbitlogs-digital-twin:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8086
        env:
        - name: RUST_LOG
          value: "info,digital_twin_engine=debug"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: database_url
        - name: RUN_MIGRATIONS
          value: "false"
        - name: KAFKA_BROKERS
          value: "orbitlogs-kafka-headless:9092"
        - name: PORT
          value: "8086"
        - name: PROCESSED_TOPIC
          value: "telemetry.processed"
        - name: TIMELINE_EVENTS_TOPIC
          value: "timeline.events"
        - name: GROUP_ID
          value: "digital-twin-group"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: api_key
        - name: CORS_ALLOWED_ORIGIN
          value: "http://localhost:3000"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbitlogs-digital-twin
  namespace: orbitlogs
spec:
  ports:
  - port: 8086
    targetPort: 8086
  selector:
    app: orbitlogs-digital-twin
