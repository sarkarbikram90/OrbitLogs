apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitlogs-ground-station-simulator
  namespace: orbitlogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbitlogs-ground-station-simulator
  template:
    metadata:
      labels:
        app: orbitlogs-ground-station-simulator
    spec:
      containers:
      - name: orbitlogs-ground-station-simulator
        image: orbitlogs/orbitlogs-ground-station-simulator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: RUST_LOG
          value: "info,ground_station_simulator=debug" 
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: database_url
        - name: RUN_MIGRATIONS
          value: "false"
        - name: KAFKA_BROKERS
          value: "orbitlogs-kafka-headless:9092" 
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbitlogs-ground-station-simulator
  namespace: orbitlogs
spec:
  ports:
  - port: 8083
    targetPort: 8083
  selector:
    app: orbitlogs-ground-station-simulator
