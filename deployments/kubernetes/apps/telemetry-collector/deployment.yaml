apiVersion: apps/v1
kind: Deployment
metadata:
  name: spaceops-collector
  namespace: spaceops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spaceops-collector
  template:
    metadata:
      labels:
        app: spaceops-collector
    spec:
      containers:
      - name: spaceops-collector
        image: spaceops/spaceops-collector:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: RUST_LOG
          value: "info,telemetry_collector=debug" 
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: spaceops-secrets
              key: database_url
        - name: KAFKA_BROKERS
          value: "spaceops-kafka-headless:9092" 
        - name: HTTP_PORT
          value: "8080" 
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: spaceops-secrets
              key: api_key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spaceops-collector
  namespace: spaceops
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: spaceops-collector
