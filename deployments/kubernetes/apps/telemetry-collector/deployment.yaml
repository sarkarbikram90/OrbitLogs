apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitlogs-collector
  namespace: orbitlogs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbitlogs-collector
  template:
    metadata:
      labels:
        app: orbitlogs-collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: orbitlogs-collector
        image: orbitlogs/orbitlogs-collector:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: RUST_LOG
          value: "info,telemetry_collector=debug" 
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: database_url
        - name: RUN_MIGRATIONS
          value: "false"
        - name: KAFKA_BROKERS
          value: "orbitlogs-kafka-headless:9092" 
        - name: HTTP_PORT
          value: "8080" 
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: api_key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbitlogs-collector
  namespace: orbitlogs
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: orbitlogs-collector
