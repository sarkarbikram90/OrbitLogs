apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spaceops-collector-hpa
  namespace: spaceops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spaceops-collector
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
