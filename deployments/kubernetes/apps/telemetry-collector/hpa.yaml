apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spaceops-collector-hpa
  namespace: spaceops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spaceops-collector
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: External
    external:
      metric:
        name: consumer_lag_messages
      target:
        type: Value
        averageValue: 10000
