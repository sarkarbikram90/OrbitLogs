apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitlogs-timeline
  namespace: orbitlogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbitlogs-timeline
  template:
    metadata:
      labels:
        app: orbitlogs-timeline
    spec:
      containers:
      - name: orbitlogs-timeline
        image: orbitlogs/orbitlogs-timeline:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8087
        env:
        - name: RUST_LOG
          value: "info,mission_timeline=debug"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: database_url
        - name: RUN_MIGRATIONS
          value: "false"
        - name: KAFKA_BROKERS
          value: "orbitlogs-kafka-headless:9092"
        - name: PORT
          value: "8087"
        - name: TIMELINE_EVENTS_TOPIC
          value: "timeline.events"
        - name: HEALTH_TOPIC
          value: "mission.health"
        - name: GROUP_ID
          value: "mission-timeline-group"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: api_key
        - name: CORS_ALLOWED_ORIGIN
          value: "http://localhost:3000"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbitlogs-timeline
  namespace: orbitlogs
spec:
  ports:
  - port: 8087
    targetPort: 8087
  selector:
    app: orbitlogs-timeline
