apiVersion: apps/v1
kind: Deployment
metadata:
  name: spaceops-replay-engine
  namespace: spaceops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spaceops-replay-engine
  template:
    metadata:
      labels:
        app: spaceops-replay-engine
    spec:
      containers:
      - name: spaceops-replay-engine
        image: spaceops/spaceops-replay-engine:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8084
        env:
        - name: RUST_LOG
          value: "info,mission_replay_engine=debug" 
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: spaceops-secrets
              key: database_url
        - name: RUN_MIGRATIONS
          value: "false"
        - name: PORT
          value: "8084" 
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: spaceops-secrets
              key: api_key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spaceops-replay-engine
  namespace: spaceops
spec:
  ports:
  - port: 8084
    targetPort: 8084
  selector:
    app: spaceops-replay-engine
