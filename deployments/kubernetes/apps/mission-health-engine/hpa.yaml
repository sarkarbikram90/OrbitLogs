apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbitlogs-health-engine-hpa
  namespace: orbitlogs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbitlogs-health-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: External
    external:
      metric:
        name: consumer_lag_messages
      target:
        type: Value
        averageValue: 10000
