apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitlogs-ai-incident-commander
  namespace: orbitlogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbitlogs-ai-incident-commander
  template:
    metadata:
      labels:
        app: orbitlogs-ai-incident-commander
    spec:
      containers:
      - name: orbitlogs-ai-incident-commander
        image: orbitlogs/orbitlogs-ai-incident-commander:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8088
        env:
        - name: RUST_LOG
          value: "info,ai_incident_commander=debug"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: database_url
        - name: RUN_MIGRATIONS
          value: "false"
        - name: PORT
          value: "8088"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: api_key
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: gemini_api_key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: openai_api_key
              optional: true
        - name: CORS_ALLOWED_ORIGIN
          value: "http://localhost:3000"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbitlogs-ai-incident-commander
  namespace: orbitlogs
spec:
  ports:
  - port: 8088
    targetPort: 8088
  selector:
    app: orbitlogs-ai-incident-commander
