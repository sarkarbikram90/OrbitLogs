apiVersion: apps/v1
kind: Deployment
metadata:
  name: spaceops-mission-command
  namespace: spaceops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spaceops-mission-command
  template:
    metadata:
      labels:
        app: spaceops-mission-command
    spec:
      containers:
      - name: spaceops-mission-command
        image: spaceops/spaceops-mission-command:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8085
        env:
        - name: RUST_LOG
          value: "info,mission_command_service=debug"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: spaceops-secrets
              key: database_url
        - name: RUN_MIGRATIONS
          value: "false"
        - name: KAFKA_BROKERS
          value: "spaceops-kafka-headless:9092"
        - name: PORT
          value: "8085"
        - name: COMMAND_EVENTS_TOPIC
          value: "command.events"
        - name: TIMELINE_EVENTS_TOPIC
          value: "timeline.events"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: spaceops-secrets
              key: api_key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: spaceops-secrets
              key: jwt_secret
        - name: CORS_ALLOWED_ORIGIN
          value: "http://localhost:3000"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spaceops-mission-command
  namespace: spaceops
spec:
  ports:
  - port: 8085
    targetPort: 8085
  selector:
    app: spaceops-mission-command
