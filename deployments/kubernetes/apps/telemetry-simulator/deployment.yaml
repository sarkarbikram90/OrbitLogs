apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitlogs-simulator
  namespace: orbitlogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbitlogs-simulator
  template:
    metadata:
      labels:
        app: orbitlogs-simulator
    spec:
      containers:
      - name: orbitlogs-simulator
        image: orbitlogs/orbitlogs-simulator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: RUST_LOG
          value: "info,telemetry_simulator=debug" 
        - name: COLLECTOR_URL
          value: "http://orbitlogs-collector:8080/telemetry" 
        - name: KAFKA_BROKERS
          value: "orbitlogs-kafka-headless:9092" 
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: orbitlogs-secrets
              key: api_key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbitlogs-simulator
  namespace: orbitlogs
spec:
  ports:
  - port: 8081
    targetPort: 8081
  selector:
    app: orbitlogs-simulator
