# WARNING: DO NOT COMMIT REAL PRODUCTION CREDENTIALS TO VERSION CONTROL.
# This template is intended solely for local testing and demonstration purposes.
#
# Production Security Recommendation:
# For production environments, replace this static Secret with SealedSecrets (Bitnami)
# or configure the External Secrets Operator (ESO) to mount secrets dynamically
# from a secure secrets provider like HashiCorp Vault, AWS Secrets Manager, or Google Secret Manager.
#
# Integration Guide:
# 1. Install External Secrets Operator (ESO) in the cluster.
# 2. Define a SecretStore or ClusterSecretStore referencing your Vault/AWS/Google secret provider endpoint.
# 3. Create an ExternalSecret resource in the 'orbitlogs' namespace to pull database credentials.
#    ESO will automatically generate this K8s 'Secret' dynamically.
#
apiVersion: v1
kind: Secret
metadata:
  name: orbitlogs-secrets
  namespace: orbitlogs
type: Opaque
stringData:
  postgres_password: "postgrespassword"
  kafka_sasl_password: "kafkasaslpassword"
  api_key: "default-dev-key-12345"
  grafana_admin_password: "grafanapassword"
  database_url: "postgres://postgres:postgrespassword@orbitlogs-timescaledb:5432/orbitlogs"
  jwt_secret: "default-dev-jwt-secret"
  gemini_api_key: "default-dev-gemini-key"
