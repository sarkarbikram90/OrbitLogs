apiVersion: v1
kind: Secret
metadata:
  name: spaceops-secrets
  namespace: spaceops
type: Opaque
stringData:
  postgres_password: "postgrespassword"
  kafka_sasl_password: "kafkasaslpassword"
  api_key: "default-dev-key-12345"
  grafana_admin_password: "grafanapassword"
  database_url: "postgres://postgres:postgrespassword@spaceops-timescaledb:5432/spaceops"
