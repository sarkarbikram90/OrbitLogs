services:
  timescaledb:
    image: timescale/timescaledb:2.15.0-pg15
    container_name: orbitlogs-timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbitlogs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
    - 5432:5432
    volumes:
    - timescaledb_data:/var/lib/postgresql/data
    - ../postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d orbitlogs
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    secrets:
    - postgres_password
    restart: unless-stopped
  certs-generator:
    image: confluentinc/cp-kafka:7.4.0
    container_name: orbitlogs-certs-generator
    volumes:
      - ./secrets:/secrets
      - ./scripts:/scripts
    entrypoint: [ "bash", "/scripts/generate_kafka_certs.sh" ]
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: orbitlogs-kafka-init
    depends_on:
    - certs-generator
    - kafka-1
    - kafka-2
    - kafka-3
    entrypoint:
    - bash
    - -c
    - "\n      echo 'Waiting for Kafka to be ready...';\n      cub kafka-ready -b\
      \ kafka-1:9092,kafka-2:9094,kafka-3:9096 3 60 && \\\n      kafka-topics --create\
      \ --if-not-exists --bootstrap-server kafka-1:9092 --partitions 3 --replication-factor\
      \ 3 --topic telemetry.raw && \\\n      kafka-topics --create --if-not-exists\
      \ --bootstrap-server kafka-1:9092 --partitions 3 --replication-factor 3 --topic\
      \ telemetry.processed && \\\n      kafka-topics --create --if-not-exists --bootstrap-server\
      \ kafka-1:9092 --partitions 3 --replication-factor 3 --topic telemetry.invalid\
      \ && \\\n      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:9092\
      \ --partitions 3 --replication-factor 3 --topic mission.health && \\\n     \
      \ kafka-topics --create --if-not-exists --bootstrap-server kafka-1:9092 --partitions\
      \ 3 --replication-factor 3 --topic groundstation.health && \\\n      kafka-topics\
      \ --create --if-not-exists --bootstrap-server kafka-1:9092 --partitions 3 --replication-factor\
      \ 3 --topic telemetry.dlq && \\\n      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:9092 --partitions 3 --replication-factor 3 --topic timeline.events && \\\n      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:9092 --partitions 3 --replication-factor 3 --topic command.events && \\\n      kafka-topics --create --if-not-exists --bootstrap-server kafka-1:9092 --partitions 3 --replication-factor 3 --topic contact.events && \\\n      echo 'Kafka topics created successfully!';"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: orbitlogs-jaeger
    ports:
    - 16686:16686
    - 4317:4317
    environment:
    - COLLECTOR_OTLP_ENABLED=true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.82.0
    container_name: orbitlogs-otel-collector
    volumes:
    - ../otel/otel-collector-config.yml:/etc/otelcol/config.yaml
    command:
    - --config=/etc/otelcol/config.yaml
    ports:
    - 4318:4318
    depends_on:
    - jaeger
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: orbitlogs-alertmanager
    volumes:
    - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
    - 9093:9093
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.46.0
    container_name: orbitlogs-prometheus
    volumes:
    - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    - ../prometheus/rules.yml:/etc/prometheus/rules.yml
    ports:
    - 9090:9090
    depends_on:
    - alertmanager
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
  grafana:
    image: grafana/grafana:10.0.3
    container_name: orbitlogs-grafana
    volumes:
    - ../grafana/provision/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
    - ../grafana/provision/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    - ../grafana/dashboards:/var/lib/grafana/dashboards
    environment:
    - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
    ports:
    - 3005:3000
    depends_on:
    - prometheus
    - timescaledb
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    secrets:
    - grafana_admin_password
    restart: unless-stopped
  telemetry-collector:
    build:
      context: ../../
      dockerfile: apps/telemetry-collector/Dockerfile
    container_name: orbitlogs-collector
    ports:
    - 8080:8080
    volumes:
    - ./secrets/certs:/etc/kafka/secrets
    environment:
    - RUST_LOG=info,telemetry_collector=debug
    - DATABASE_URL_FILE=/run/secrets/database_url
    - KAFKA_BROKERS=kafka-1:29092,kafka-2:29094,kafka-3:29096
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    - HTTP_PORT=8080
    - API_KEY_FILE=/run/secrets/api_key
    - KAFKA_SASL_PASSWORD_FILE=/run/secrets/kafka_sasl_password
    - KAFKA_SECURITY_PROTOCOL=ssl
    - KAFKA_SSL_CA_LOCATION=/etc/kafka/secrets/ca-cert
    - KAFKA_SSL_CERTIFICATE_LOCATION=/etc/kafka/secrets/client-cert.pem
    - KAFKA_SSL_KEY_LOCATION=/etc/kafka/secrets/client-key.pem
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    secrets:
    - database_url
    - api_key
    - kafka_sasl_password
    restart: unless-stopped
  telemetry-simulator:
    build:
      context: ../../
      dockerfile: apps/telemetry-simulator/Dockerfile
    container_name: orbitlogs-simulator
    ports:
    - 8081:8081
    volumes:
    - ./secrets/certs:/etc/kafka/secrets
    environment:
    - RUST_LOG=info,telemetry_simulator=debug
    - COLLECTOR_URL=http://telemetry-collector:8080/telemetry
    - SIM_FLEET_SIZE=10
    - SIM_FREQUENCY_MS=1000
    - METRICS_PORT=8081
    - KAFKA_BROKERS=kafka-1:29092,kafka-2:29094,kafka-3:29096
    - HEALTH_TOPIC=groundstation.health
    - API_KEY_FILE=/run/secrets/api_key
    - KAFKA_SASL_PASSWORD_FILE=/run/secrets/kafka_sasl_password
    - KAFKA_SECURITY_PROTOCOL=ssl
    - KAFKA_SSL_CA_LOCATION=/etc/kafka/secrets/ca-cert
    - KAFKA_SSL_CERTIFICATE_LOCATION=/etc/kafka/secrets/client-cert.pem
    - KAFKA_SSL_KEY_LOCATION=/etc/kafka/secrets/client-key.pem
    depends_on:
      telemetry-collector:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    secrets:
    - api_key
    - kafka_sasl_password
    restart: unless-stopped
  mission-health-engine:
    build:
      context: ../../
      dockerfile: apps/mission-health-engine/Dockerfile
    container_name: orbitlogs-health-engine
    ports:
    - 8082:8082
    volumes:
    - ./secrets/certs:/etc/kafka/secrets
    environment:
    - RUST_LOG=info,mission_health_engine=debug
    - DATABASE_URL_FILE=/run/secrets/database_url
    - KAFKA_BROKERS=kafka-1:29092,kafka-2:29094,kafka-3:29096
    - PROCESSED_TOPIC=telemetry.processed
    - HEALTH_TOPIC=mission.health
    - GS_HEALTH_TOPIC=groundstation.health
    - GROUP_ID=mission-health-group
    - METRICS_PORT=8082
    - KAFKA_SASL_PASSWORD_FILE=/run/secrets/kafka_sasl_password
    - KAFKA_SECURITY_PROTOCOL=ssl
    - KAFKA_SSL_CA_LOCATION=/etc/kafka/secrets/ca-cert
    - KAFKA_SSL_CERTIFICATE_LOCATION=/etc/kafka/secrets/client-cert.pem
    - KAFKA_SSL_KEY_LOCATION=/etc/kafka/secrets/client-key.pem
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    secrets:
    - database_url
    - kafka_sasl_password
    restart: unless-stopped
  ground-station-simulator:
    build:
      context: ../../
      dockerfile: apps/ground-station-simulator/Dockerfile
    container_name: orbitlogs-ground-station-simulator
    ports:
    - 8083:8083
    volumes:
    - ./secrets/certs:/etc/kafka/secrets
    environment:
    - RUST_LOG=info,ground_station_simulator=debug
    - DATABASE_URL_FILE=/run/secrets/database_url
    - KAFKA_BROKERS=kafka-1:29092,kafka-2:29094,kafka-3:29096
    - HEALTH_TOPIC=groundstation.health
    - METRICS_PORT=8083
    - SIM_FREQUENCY_SEC=2
    - KAFKA_SASL_PASSWORD_FILE=/run/secrets/kafka_sasl_password
    - KAFKA_SECURITY_PROTOCOL=ssl
    - KAFKA_SSL_CA_LOCATION=/etc/kafka/secrets/ca-cert
    - KAFKA_SSL_CERTIFICATE_LOCATION=/etc/kafka/secrets/client-cert.pem
    - KAFKA_SSL_KEY_LOCATION=/etc/kafka/secrets/client-key.pem
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    secrets:
    - database_url
    - kafka_sasl_password
    restart: unless-stopped
  mission-replay-engine:
    build:
      context: ../../
      dockerfile: apps/mission-replay-engine/Dockerfile
    container_name: orbitlogs-replay-engine
    ports:
    - 8084:8084
    environment:
    - RUST_LOG=info,mission_replay_engine=debug
    - DATABASE_URL_FILE=/run/secrets/database_url
    - PORT=8084
    - API_KEY_FILE=/run/secrets/api_key
    depends_on:
    - timescaledb
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    secrets:
    - database_url
    - api_key
    restart: unless-stopped
  orbit-ops-service:
    build:
      context: ../../
      dockerfile: apps/orbit-ops-service/Dockerfile
    container_name: orbitlogs-orbit-ops
    ports:
    - 8095:8095
    volumes:
    - ./secrets/certs:/etc/kafka/secrets
    environment:
    - RUST_LOG=info,orbit_ops_service=debug
    - DATABASE_URL_FILE=/run/secrets/database_url
    - KAFKA_BROKERS=kafka-1:29092,kafka-2:29094,kafka-3:29096
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    - PORT=8095
    - PROCESSED_TOPIC=telemetry.processed
    - TIMELINE_EVENTS_TOPIC=timeline.events
    - COMMAND_EVENTS_TOPIC=command.events
    - CONTACT_EVENTS_TOPIC=contact.events
    - GROUP_ID=orbit-ops-group
    - KAFKA_SECURITY_PROTOCOL=ssl
    - KAFKA_SSL_CA_LOCATION=/etc/kafka/secrets/ca-cert
    - KAFKA_SSL_CERTIFICATE_LOCATION=/etc/kafka/secrets/client-cert.pem
    - KAFKA_SSL_KEY_LOCATION=/etc/kafka/secrets/client-key.pem
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    secrets:
    - database_url
    restart: unless-stopped
  space-otel-collector:
    build:
      context: ../../
      dockerfile: crates/space-otel-collector/Dockerfile
    container_name: orbitlogs-otel-metrics-collector
    ports:
    - 8091:8091
    volumes:
    - ./secrets/certs:/etc/kafka/secrets
    environment:
    - RUST_LOG=info,space_otel_collector=debug
    - KAFKA_BROKERS=kafka-1:29092,kafka-2:29094,kafka-3:29096
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    - METRICS_PORT=8091
    - KAFKA_SASL_PASSWORD_FILE=/run/secrets/kafka_sasl_password
    - KAFKA_SECURITY_PROTOCOL=ssl
    - KAFKA_SSL_CA_LOCATION=/etc/kafka/secrets/ca-cert
    - KAFKA_SSL_CERTIFICATE_LOCATION=/etc/kafka/secrets/client-cert.pem
    - KAFKA_SSL_KEY_LOCATION=/etc/kafka/secrets/client-key.pem
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    secrets:
    - kafka_sasl_password
    restart: unless-stopped
  mission-control-ui:
    build:
      context: ../../
      dockerfile: apps/mission-control-ui/Dockerfile
    container_name: orbitlogs-mission-control-ui
    ports:
    - 3000:3000
    depends_on:
    - telemetry-collector
    - mission-replay-engine
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
  kafka-1:
    image: confluentinc/cp-kafka:7.4.0
    container_name: orbitlogs-kafka-1
    ports:
    - 9092:9092
    volumes:
    - ./secrets/certs:/etc/kafka/secrets
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: SSL://kafka-1:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka-1:9093
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka-1.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: orbitlogspass
      KAFKA_SSL_KEY_PASSWORD: orbitlogspass
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka-1.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: orbitlogspass
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_KRAFT_CLUSTER_ID: 4L62C12345678901234567
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      certs-generator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped
  kafka-2:
    image: confluentinc/cp-kafka:7.4.0
    container_name: orbitlogs-kafka-2
    ports:
    - 9094:9094
    volumes:
    - ./secrets/certs:/etc/kafka/secrets
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: SSL://kafka-2:29094,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://kafka-2:9093
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka-2:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka-2.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: orbitlogspass
      KAFKA_SSL_KEY_PASSWORD: orbitlogspass
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka-2.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: orbitlogspass
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_KRAFT_CLUSTER_ID: 4L62C12345678901234567
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server localhost:9094 --list
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      certs-generator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped
  kafka-3:
    image: confluentinc/cp-kafka:7.4.0
    container_name: orbitlogs-kafka-3
    ports:
    - 9096:9096
    volumes:
    - ./secrets/certs:/etc/kafka/secrets
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: SSL://kafka-3:29096,PLAINTEXT_HOST://0.0.0.0:9096,CONTROLLER://kafka-3:9093
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka-3:29096,PLAINTEXT_HOST://localhost:9096
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka-3.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: orbitlogspass
      KAFKA_SSL_KEY_PASSWORD: orbitlogspass
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka-3.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: orbitlogspass
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_KRAFT_CLUSTER_ID: 4L62C12345678901234567
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server localhost:9096 --list
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      certs-generator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  kafka_sasl_password:
    file: ./secrets/kafka_sasl_password.txt
  api_key:
    file: ./secrets/api_key.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  database_url:
    file: ./secrets/database_url.txt
volumes:
  timescaledb_data: null
