global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "telemetry-collector"
    static_configs:
      - targets: ["telemetry-collector:8080"]

  - job_name: "telemetry-simulator"
    static_configs:
      - targets: ["telemetry-simulator:8081"]

  - job_name: "mission-health-engine"
    static_configs:
      - targets: ["mission-health-engine:8082"]

  - job_name: "ground-station-simulator"
    static_configs:
      - targets: ["ground-station-simulator:8083"]

  - job_name: "mission-replay-engine"
    static_configs:
      - targets: ["mission-replay-engine:8084"]
