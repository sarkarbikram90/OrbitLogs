[package]
name = "mission-command-service"
version = "1.0.0"
edition = "2021"
description = "Mission Command Service - Models spacecraft command workflows with RBAC and OTel tracking"

[dependencies]
tokio = { workspace = true }
axum = { version = "0.7", features = ["macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
rdkafka = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
orbitlogs-models = { workspace = true }
tower-http = { version = "0.5", features = ["cors", "timeout"] }
jsonwebtoken = { workspace = true }
subtle = { workspace = true }
dashmap = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

