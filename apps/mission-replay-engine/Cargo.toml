[package]
name = "mission-replay-engine"
version = "1.0.0"
edition = "2021"
description = "Historical telemetry and events replay engine for the OrbitLogs platform"

[dependencies]
tokio = { workspace = true }
axum = { version = "0.7", features = ["macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
orbitlogs-models = { workspace = true }
orbitlogs-packets = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
uuid = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
dashmap = "5.5"
subtle = { workspace = true }
tower-http = { version = "0.5", features = ["timeout"] }


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
