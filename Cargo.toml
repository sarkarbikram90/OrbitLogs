[workspace]
resolver = "2"
members = [
    "apps/telemetry-simulator",
    "apps/telemetry-collector",
    "apps/mission-health-engine",
    "apps/ground-station-simulator",
    "apps/mission-replay-engine",
    "apps/mission-command-service",
    "apps/digital-twin-engine",
    "apps/mission-timeline",
    "apps/ai-incident-commander",
    "apps/constellation-simulator",
    "apps/orbit-ops-service",
    "crates/orbitlogs-models",
    "crates/orbitlogs-packets",
    "crates/space-schema-registry",
    "crates/fleet-health",
    "apps/space-otel-collector",
    "crates/orbitlogs-astrodynamics",
    "crates/orbitlogs-propulsion",
    "apps/contact-window-predictor",
    "apps/constellation-scheduler",
    "apps/orbit-determination-service",
    "apps/autonomous-mission-planning",
    "crates/orbitlogs-test-utils",
]

[workspace.dependencies]
thiserror = "1.0"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
clap = { version = "4.5", features = ["derive", "env"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "migrate"] }
sha2 = "0.10"
rdkafka = { version = "0.36", features = ["cmake-build"] }
prometheus = { version = "0.13", features = ["process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.21" }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.14", features = ["grpc-tonic", "tokio"] }
tracing-opentelemetry = "0.22"
anyhow = "1.0"
dotenvy = "0.15"
orbitlogs-models = { path = "crates/orbitlogs-models" }
orbitlogs-packets = { path = "crates/orbitlogs-packets" }
space-schema-registry = { path = "crates/space-schema-registry" }
fleet-health = { path = "crates/fleet-health" }
subtle = "2.5"
dashmap = "5.5"
axum = { version = "0.7.9" }
jsonwebtoken = "9.3"
tokio-util = "0.7"
regex = "1.10"
tower = { version = "0.5", features = ["limit", "util", "buffer", "load-shed"] }
tower-http = { version = "0.5", features = ["cors", "timeout"] }
proptest = "1.4.0"
criterion = "0.5"
lru = "0.12"
sgp4 = "0.2"
nalgebra = { version = "0.32", features = ["serde-serialize"] }
orbitlogs-astrodynamics = { path = "crates/orbitlogs-astrodynamics" }
orbitlogs-propulsion = { path = "crates/orbitlogs-propulsion" }
orbitlogs-test-utils = { path = "crates/orbitlogs-test-utils" }
ort = "2.0.0-rc.9"

# Optimize profiles for production build speed vs runtime execution speed
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
