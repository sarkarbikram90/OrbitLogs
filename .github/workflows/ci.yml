name: Open SpaceOps CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust Formatting, Linting & Testing
    runs-on: ubuntu-latest

    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: spaceops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spaceops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/spaceops

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake gcc g++ build-essential postgresql-client

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Initialize Database Schema
        run: |
          echo "Waiting for TimescaleDB to accept connections on localhost..."
          for i in {1..30}; do
            if PGPASSWORD=postgrespassword psql -h localhost -U postgres -d spaceops -c "SELECT 1" >/dev/null 2>&1; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for database (attempt $i)..."
            sleep 1
          done
          for f in deployments/postgres/migrations/*.sql; do
            echo "Applying migration: $f"
            PGPASSWORD=postgrespassword psql -h localhost -U postgres -d spaceops -f "$f"
          done

      - name: Check code formatting
        run: cargo fmt --check

      - name: Cargo clippy linting
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --all-targets --all-features

  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run dependency vulnerability audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run license and advisory checks
        uses: EmbarkStudios/cargo-deny-action@v2

  container-builds:
    name: Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Telemetry Simulator Container
        run: |
          docker build -t open-spaceops/telemetry-simulator:test -f apps/telemetry-simulator/Dockerfile .

      - name: Build Telemetry Collector Container
        run: |
          docker build -t open-spaceops/telemetry-collector:test -f apps/telemetry-collector/Dockerfile .

      - name: Verify non-root container execution
        run: |
          echo "Checking collector runs as non-root..."
          docker run --rm --entrypoint whoami open-spaceops/telemetry-collector:test | grep -q spaceops
          echo "Checking simulator runs as non-root..."
          docker run --rm --entrypoint whoami open-spaceops/telemetry-simulator:test | grep -q spaceops
          echo "All containers verified as non-root."

  frontend-ci:
    name: Frontend Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mission-control-ui/package-lock.json

      - name: Install dependencies
        working-directory: apps/mission-control-ui
        run: npm ci

      - name: Run ESLint
        working-directory: apps/mission-control-ui
        run: npm run lint

      - name: Build production bundle
        working-directory: apps/mission-control-ui
        run: npm run build
